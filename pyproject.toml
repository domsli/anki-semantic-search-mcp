[project]
name = "anki-semantic-search"
version = "0.1.0"
description = "Local semantic search over Anki notes, exposed as an MCP server."
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.7",
    "fastmcp>=2.11",
    "httpx>=0.28",
    "lancedb>=0.24",
    "tomli-w>=1.1",
]

[project.scripts]
anki-search = "anki_semantic_search.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
